<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="calc.css" />
  </head>
  <body>
    <div class="cal">
      <form id="calculator">
        <input type="text" name="a" id="numberA" />
        <select name="operator" id="operator">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="*">*</option>
          <option value="/">/</option>
          <option value="%">%</option>
        </select>
        <input type="text" name="b" id="numberB" />
        <input type="submit" value="Try me!" />
      </form>
    </div>
  </body>
</html>

<script src="calc.js"></script>
